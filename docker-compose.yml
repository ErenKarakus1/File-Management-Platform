services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: file_management
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d file_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/file_management?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-secret}
      TOKEN_TTL: 24h
      FILE_STORAGE_DIR: /app/storage
      MAX_UPLOAD_BYTES: 52428800
      FILE_WORKER_COUNT: 2
      FILE_DELETE_WORKER_COUNT: 1
      FILE_WORKER_POLL: 1s
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      RATE_LIMIT: 120
      RATE_LIMIT_WINDOW: 1m
    volumes:
      - file_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  file_storage:
